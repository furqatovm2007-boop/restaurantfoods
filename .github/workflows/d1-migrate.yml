# Applies pending drizzle/*.sql migrations to the production D1 database. Run it by hand
# (Actions → D1 migrations → Run workflow) before deploying code that needs a new migration.
# Needs repository secrets CLOUDFLARE_API_TOKEN (with D1 Edit) and CLOUDFLARE_ACCOUNT_ID.
name: D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > wrangler.migrate.json <<'JSON'
          {
            "name": "restaurantfoods",
            "compatibility_date": "2026-05-15",
            "d1_databases": [
              { "binding": "DB", "database_name": "restaurantfoods-db", "database_id": "6f40dc57-ec4a-463d-8d3c-455135091c48", "migrations_dir": "drizzle" }
            ]
          }
          JSON
          npx wrangler d1 migrations list restaurantfoods-db --remote -c wrangler.migrate.json
          npx wrangler d1 migrations apply restaurantfoods-db --remote -c wrangler.migrate.json
